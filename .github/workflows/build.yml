name: build

on:
  pull_request:
    branches: [main, c3-upgrade]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-only') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          dependency-groups: dev
          extras: ""
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Transitional evidence only. This becomes blocking when the typing branch is integrated.
  typing-baseline:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: dev
          extras: ""
      - run: uv run pyright

  wheels:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux
            arch: x86_64
          # macOS Intel is explicitly deferred and remains unverified because the
          # hosted Intel runner does not start reliably for the initiative.
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: AMD64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@c923d83ad9c1bc00211c5041d0c3f73294ff88f6 # v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_TEST: >-
            python -m pip install
            "compas @ git+https://github.com/compas-dev/compas.git@e54f8ae0eba39e84b1290bea9c368a1a646dfdcd"
          CIBW_TEST_REQUIRES: numpy>=1.24 pytest build tessagon
        with:
          output-dir: wheelhouse
      - name: Verify wheel contents
        shell: bash
        run: python .github/scripts/verify_native_wheel.py wheelhouse/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  wheel-smoke:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: manylinux
            python: "3.12"
          - os: ubuntu-latest
            artifact: manylinux
            python: "3.14"
          - os: macos-15
            artifact: macos-arm64
            python: "3.12"
          - os: macos-15
            artifact: macos-arm64
            python: "3.14"
          - os: windows-latest
            artifact: windows
            python: "3.12"
          - os: windows-latest
            artifact: windows
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-${{ matrix.artifact }}
          path: wheelhouse
      - name: Install and import the exact wheel
        run: >-
          python .github/scripts/smoke_test_wheel.py wheelhouse
          --constraint .github/constraints/compas-candidate.txt

  sdist:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: compas-dev/compas-actions/package@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints/compas-candidate.txt
        with:
          sdist: true
          wheel: false
          skip-install: true
      - name: Build a wheel from the source distribution
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir sdist-wheelhouse
      - name: Verify the source-built wheel
        run: python .github/scripts/verify_native_wheel.py sdist-wheelhouse/*.whl
      - name: Install and import the source-built wheel
        run: >-
          python .github/scripts/smoke_test_wheel.py sdist-wheelhouse
          --constraint .github/constraints/compas-candidate.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
