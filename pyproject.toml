[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_libigl"
description = "libigl wrapper for COMPAS."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
]
classifiers = ["License :: OSI Approved :: MIT License"]

dynamic = ['version']
dependencies = [
    "compas>=3.0,<4",
    "numpy>=1.24",
    "tessagon",
]

[project.urls]
Homepage = "https://compas.dev/compas_libigl/latest/"

[project.entry-points."compas.plugins"]
compas_libigl_intersections = "compas_libigl.plugins.intersections"
compas_libigl_quadmesh = "compas_libigl.plugins.quadmesh"
compas_libigl_trimesh = "compas_libigl.plugins.trimesh"

# ============================================================================
# pyproject dependecy groups
# ============================================================================

[dependency-groups]
dev = [
    "bump-my-version>=1.2",
    "invoke>=2.2",
    "line-profiler",
    "pre-commit",
    "pyright==1.1.414",
    "ruff>=0.14",
    { include-group = "build" },
    { include-group = "tests" },
    { include-group = "docs" },
]
build = [
    "build>=1.2",
    "cibuildwheel==2.23.1",
    "cmake>=3.15",
    "nanobind>=1.3.2",
    "ninja>=1.11",
    "scikit-build-core>=0.10",
    "twine>=6",
    "wheel",
]
tests = [
    "pytest>=7",
]
docs = [
    "compas-viewer>=2",
    "mike>=2",
    "mkdocs>=1.6",
    "mkdocs-autorefs>=1.4",
    "mkdocs-material>=9.5",
    "mkdocs-section-index>=0.3",
    "mkdocstrings[python]>=0.30",
]

# ============================================================================
# pytest configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# scikit-build configuration
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"                    # Build all Python currently supported versions
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_libigl/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "21fdcaa5e7bf1a642030005a636164f63446d122" }

# ============================================================================
# cibuildwheel configuration
# ============================================================================

[tool.cibuildwheel]
build = ["cp312-*"]
build-verbosity = 3
before-test = "pip install 'compas @ git+https://github.com/compas-dev/compas.git@21fdcaa5e7bf1a642030005a636164f63446d122' && pip list"
test-requires = ["numpy>=1.24", "pytest", "build", "tessagon"]
test-command = "pytest {project}/tests"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux_2_28"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.00"
macos.archs = ["x86_64", "arm64"]

# ============================================================================
# bumpversion configuration
# ============================================================================

[tool.bumpversion]
current_version = "0.7.6"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_libigl/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# code style configuration
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"

[tool.pyright]
exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]
"docs/examples/*.py" = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["docs/**/*.md"]
